<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>新手学院</title>
  <style>
    :root {
      --bg: #f6f7f9; --paper: #fff; --text: #262a32; --sub: #747d8a;
      --line: #edf0f3; --brand: #fa6034; --soft: #fff0e7; --ink: #414a5a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    body { font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; color: var(--text); }
    button, textarea, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    #app { height: 100%; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
    header { flex: none; display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 8px 14px; background: var(--paper); }
    header strong { font-size: 17px; font-weight: 600; }
    .quiet { border: 0; background: none; color: var(--sub); padding: 8px 0; font-size: 13px; }
    .text-btn { color: var(--brand); font-weight: 600; padding: 8px 0 0; }
    #view { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 18px; }
    h2 { font-size: 22px; line-height: 1.35; margin: 8px 0; font-weight: 650; letter-spacing: -.4px; }
    h3 { margin: 0; font-size: 16px; font-weight: 600; }
    p { margin: 6px 0; color: var(--sub); font-size: 12px; }
    .hero { margin: 0 -16px; padding: 18px 20px 16px; background: linear-gradient(145deg, var(--soft), var(--paper)); }
    .eyebrow { font-size: 11px; letter-spacing: 1.2px; color: var(--brand); }
    .stage-tabs { display: flex; gap: 6px; margin-top: 14px; padding: 5px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
    .stage-tabs button { flex: 1; text-align: left; border: 0; border-radius: 10px; background: none; padding: 10px 12px; color: var(--sub); }
    .stage-tabs button small, .stage-tabs button span { display: block; font-size: 11px; }
    .stage-tabs button strong { display: block; margin: 2px 0; font-size: 16px; }
    .stage-tabs button[aria-selected="true"] { background: var(--soft); color: var(--brand); }
    .section { margin-top: 18px; }
    .section-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
    .section-head small { color: var(--sub); font-size: 11px; }
    .lesson-list { background: var(--paper); border-radius: 16px; padding: 0 14px; }
    .lesson { width: 100%; display: flex; gap: 12px; align-items: center; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; padding: 14px 0; }
    .lesson:last-child { border-bottom: 0; }
    .thumb { width: 64px; height: 64px; flex: none; border-radius: 11px; background: var(--soft); color: var(--brand); padding: 8px; font-size: 13px; font-weight: 600; line-height: 1.3; display: flex; flex-direction: column; justify-content: center; }
    .thumb small { font-size: 10px; font-weight: 400; opacity: .8; }
    .lesson-body { flex: 1; min-width: 0; }
    .lesson-body strong { font-size: 14px; font-weight: 600; }
    .chev { color: var(--sub); }
    .primary, .outline { width: 100%; border-radius: 12px; padding: 12px 14px; }
    .primary { border: 0; background: var(--brand); color: #fff; font-weight: 600; }
    .outline { background: var(--paper); border: 1px solid var(--line); }
    .primary:disabled { opacity: .4; }
    .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .tile { position: relative; border: 1px solid var(--line); background: var(--paper); border-radius: 12px; padding: 12px 6px 10px; text-align: center; }
    .tile[aria-pressed="true"] { border-color: var(--brand); background: var(--soft); }
    .logo { width: 36px; height: 36px; margin: 0 auto 6px; border-radius: 10px; overflow: hidden; background: var(--soft); display: block; }
    .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tile b { display: block; font-size: 12px; font-weight: 600; }
    .tile em { display: block; margin-top: 4px; font-style: normal; color: var(--brand); font-size: 11px; }
    .tile em strong { font-size: 15px; }
    .mark { position: absolute; top: 6px; right: 6px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); color: var(--sub); font-size: 10px; line-height: 16px; }
    .tile[aria-pressed="true"] .mark { background: var(--brand); color: #fff; }
    .picked { display: flex; align-items: center; gap: 10px; background: var(--paper); border-radius: 12px; padding: 12px; }
    .picked .logo, .lesson .logo { margin: 0; flex: none; }
    .picked strong { flex: 1; font-size: 14px; }
    .focus-intro h3 { font-size: 17px; }
    .focus-intro p { margin-top: 3px; }
    .mini-path { display: flex; margin: 14px 0 16px; }
    .mini-path > div { flex: 1; text-align: center; position: relative; color: var(--sub); }
    .mini-path > div:not(:last-child)::after { content: ""; height: 1px; background: var(--line); position: absolute; top: 13px; left: calc(50% + 17px); width: calc(100% - 34px); }
    .mini-path span { display: grid; place-items: center; border: 1px solid var(--line); background: var(--paper); width: 27px; height: 27px; border-radius: 50%; margin: 0 auto 6px; font-size: 12px; position: relative; z-index: 1; }
    .mini-path small { font-size: 11px; }
    .mini-path .active { color: var(--brand); font-weight: 600; }
    .mini-path .active span { background: var(--brand); color: #fff; border-color: var(--brand); }
    .mini-path .complete span { background: #eaf2ec; color: #608169; border-color: transparent; }
    .past-steps { margin: 0 0 12px; padding: 2px 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; }
    .past-steps > div { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); background: none; border-radius: 0; }
    .past-steps > div:last-child { border-bottom: 0; }
    .past-tick { color: #608169; font-size: 12px; }
    .past-steps small { color: var(--sub); font-size: 11px; white-space: nowrap; }
    .past-steps strong { flex: 1; font-size: 12px; text-align: right; font-weight: 500; overflow-wrap: anywhere; }
    .past-steps .quiet { font-size: 11px; white-space: nowrap; padding: 0; color: var(--sub); }
    .ms-mini { display: flex; align-items: center; gap: 6px; width: 100%; margin: 0 0 8px; padding: 4px 8px; border: 0; border-radius: 7px; background: #f8f9fb; text-align: left; color: var(--text); }
    .ms-cover { width: 18px; height: 22px; flex: none; border-radius: 4px; background: var(--soft); color: var(--brand); font-size: 7px; line-height: 1.1; font-weight: 600; display: flex; align-items: center; justify-content: center; text-align: center; }
    .ms-copy { flex: 1; min-width: 0; }
    .ms-copy b { display: block; font-size: 12px; font-weight: 600; line-height: 1.15; }
    .ms-copy small { display: block; color: #9396a2; font-size: 10px; line-height: 1.15; white-space: nowrap; }
    .ms-go { width: 7px; height: 7px; flex: none; margin-right: 2px; border-right: 1.5px solid #c5c8d0; border-bottom: 1.5px solid #c5c8d0; transform: rotate(-45deg); }
    .focus-card { padding: 18px 12px; background: var(--paper); border-radius: 18px; border: 1px solid var(--line); }
    .project-choice-list { margin: 14px 0 10px; display: flex; flex-direction: column; gap: 10px; }
    .project-rich-card { display: block; width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 13px; padding: 12px 10px; text-align: left; color: var(--text); }
    .project-rich-card[aria-pressed="true"] { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); background: #fffdfb; }
    .rich-top { display: flex; align-items: center; gap: 9px; }
    .rich-top img { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; flex: none; }
    .rich-info { flex: 1; min-width: 0; }
    .rich-info > strong { display: block; font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .rich-tags { display: flex; gap: 4px; flex-wrap: wrap; }
    .rich-tags > span { padding: 2px 4px; border-radius: 3px; background: #f5f5ff; color: #5872dc; font-size: 9px; white-space: nowrap; }
    .rich-select { padding: 6px 8px; border-radius: 20px; background: var(--brand); color: #fff; font-size: 11px; font-weight: 500; white-space: nowrap; flex: none; }
    .project-rich-card[aria-pressed="true"] .rich-select { background: #fff0e6; color: var(--brand); }
    .rich-stats { display: flex; align-items: center; margin-top: 12px; padding: 7px 8px; background: #f8f9fb; border-radius: 7px; }
    .rich-best { display: flex; align-items: center; gap: 4px; font-size: 10px; color: #9396a2; }
    .rich-best b { font-size: 11px; font-weight: 500; color: var(--sub); margin-left: 2px; }
    .rich-fire { display: grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; background: #edeff3; color: #9ca3ad; font-size: 11px; }
    .demo-note { font-size: 10px; color: var(--sub); margin: 10px 0; }
    .secondary-link { display: block; margin: 10px auto 0; padding: 8px; color: var(--sub); background: none; border: 0; }
    .single-material { display: flex; gap: 11px; align-items: center; padding: 4px 0 8px; }
    .single-cover { width: 67px; min-height: 99px; flex: none; background: var(--soft); border-radius: 8px; color: var(--brand); padding: 7px; display: flex; flex-direction: column; justify-content: space-between; }
    .single-cover small { font-size: 10px; }
    .single-cover strong { font-size: 15px; font-weight: 500; line-height: 1.25; }
    .single-material > div { min-width: 0; flex: 1; }
    .single-material > div > strong { font-size: 13px; font-weight: 600; }
    .single-material p { font-size: 12px; margin: 4px 0; }
    .own-guide { padding: 14px; background: var(--bg); border-radius: 12px; margin: 12px 0; }
    .own-guide p { margin: 4px 0; }
    .publish-list { padding: 4px 0; margin: 8px 0 12px; }
    .publish-list > div { display: flex; align-items: center; gap: 10px; margin: 12px 0; }
    .publish-list span { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; background: var(--bg); color: var(--sub); font-size: 11px; flex: none; }
    .publish-list strong { font-size: 13px; font-weight: 500; }
    .requirements-entry { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; background: var(--soft); border: 0; border-radius: 11px; text-align: left; padding: 12px; margin-top: 12px; color: var(--text); }
    .requirements-entry strong { font-size: 13px; display: block; }
    .requirements-entry small { font-size: 11px; display: block; color: var(--sub); margin-top: 4px; }
    .requirements-entry > span:last-child { font-size: 12px; color: var(--brand); white-space: nowrap; }
    .focus-card h2 { font-size: 22px; letter-spacing: -.3px; margin: 0 0 8px; }
    .focus-label { font-size: 11px; color: var(--brand); margin-bottom: 8px; font-weight: 600; }
    .focus-card .primary { margin-top: 4px; }
    .focus-card .switch button { background: var(--bg); }
    .focus-card .tiles { margin-top: 12px; }
    .focus-footnote { font-size: 10px; color: var(--sub); text-align: center; margin: 16px 0 0; }
    .card { background: var(--paper); border-radius: 12px; padding: 12px; }
    .soft { background: var(--soft); border-radius: 12px; padding: 12px; }
    .soft b { color: var(--text); }
    .row-done { display: flex; justify-content: space-between; gap: 8px; align-items: center; background: var(--paper); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
    .switch { display: flex; gap: 6px; margin: 8px 0; }
    .switch button { flex: 1; border: 0; border-radius: 8px; background: var(--paper); color: var(--sub); padding: 8px 4px; font-size: 12px; }
    .switch button[aria-pressed="true"] { background: var(--soft); color: var(--brand); }
    .ms { display: flex; gap: 10px; align-items: center; background: var(--paper); border-radius: 12px; padding: 10px; }
    .cover { width: 64px; min-height: 86px; flex: none; border-radius: 8px; background: var(--soft); color: var(--brand); padding: 8px; display: flex; flex-direction: column; justify-content: space-between; font-size: 13px; }
    .note { font-size: 11px; color: var(--sub); }
    .quota { font-size: 12px; color: var(--ink); }
    .bridge { width: 100%; margin-top: 16px; border: 0; border-top: 1px solid var(--line); background: none; display: flex; justify-content: space-between; padding: 14px 2px 0; text-align: left; color: var(--sub); font-size: 12px; }
    .bridge strong { color: var(--text); font-weight: 600; }
    .course-top { background: var(--paper); margin: 0 -16px; padding: 18px 18px 8px; }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .tags span { font-size: 11px; padding: 3px 8px; border-radius: 6px; background: var(--bg); color: var(--sub); }
    .tags span:first-child { background: var(--soft); color: var(--brand); }
    .player { position: relative; margin-top: 14px; aspect-ratio: 16/10; border-radius: 16px; overflow: hidden; background: linear-gradient(135deg, #242c38, #101318 60%); color: #fff; }
    .play { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); width: 52px; height: 52px; border: 0; border-radius: 50%; background: #f5f5f5; color: var(--brand); font-size: 18px; }
    .player .cap { position: absolute; left: 14px; right: 14px; bottom: 12px; }
    .player .cap h3 { color: #fff; }
    .rich { background: var(--paper); border-radius: 14px; padding: 14px; margin-top: 14px; font-size: 13px; line-height: 1.8; color: var(--sub); }
    .rich strong { color: var(--text); font-weight: 600; }
    .dock { position: sticky; bottom: 0; margin: 16px -16px 0; padding: 12px 16px 14px; background: var(--paper); border-top: 1px solid var(--line); }
    .dock .btns { display: flex; gap: 8px; }
    .dock .outline { width: 96px; }
    .field { margin: 10px 0; }
    .field label { display: block; font-size: 13px; margin-bottom: 6px; }
    .field label i { color: var(--brand); font-style: normal; }
    .field input, .field textarea { width: 100%; border: 0; background: #f3f4f6; border-radius: 10px; padding: 12px; }
    .sheet { background: var(--paper); border-radius: 16px; padding: 14px; margin-top: 12px; }
    .pair { display: flex; gap: 8px; margin-top: 12px; }
    .pair .outline { flex: 1; }
    .pair .primary { flex: 1.4; }
    #cs { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--paper); border-top: 1px solid var(--line); }
    #cs[hidden] { display: none; }
    .qr { width: 46px; height: 46px; flex: none; border: 1px dashed var(--sub); border-radius: 6px; display: grid; place-items: center; text-align: center; font-size: 10px; line-height: 1.25; color: var(--sub); background: var(--bg); }
    .qr.lg { width: 148px; height: 148px; margin: 12px auto; font-size: 13px; }
    #cs .txt { flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: 0; display: flex; align-items: center; gap: 10px; }
    #cs .txt > span:last-child { display: flex; flex-direction: column; min-width: 0; }
    #cs .txt strong { display: block; font-size: 13px; }
    #cs .txt small { color: var(--sub); font-size: 11px; }
    .x { width: 28px; height: 28px; border: 0; border-radius: 50%; background: var(--bg); color: var(--sub); font-size: 18px; }
    dialog { border: 0; border-radius: 18px; padding: 20px; width: min(320px, calc(100% - 36px)); max-height: calc(100% - 48px); overflow: auto; background: var(--paper); color: var(--text); }
    dialog .rule { white-space: pre-wrap; color: var(--text); font-size: 13px; line-height: 1.55; margin: 8px 0 14px; }
    dialog::backdrop { background: rgba(0, 0, 0, .45); }
    dialog h3 { font-size: 18px; line-height: 1.4; }
    .ol { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
    .ol li { display: flex; gap: 8px; font-size: 12px; }
    .ol span { width: 20px; height: 20px; flex: none; border-radius: 50%; background: var(--soft); color: var(--brand); display: grid; place-items: center; font-size: 11px; }
    .toast { position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%); background: rgba(20, 22, 26, .88); color: #fff; border-radius: 10px; padding: 8px 12px; font-size: 12px; max-width: calc(100% - 32px); z-index: 30; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <button class="quiet" id="back" type="button">〈 返回</button>
      <strong id="title">新手学院</strong>
      <span style="width:48px"></span>
    </header>
    <main id="view"></main>
    <div id="cs">
      <button class="txt" id="csOpen" type="button">
        <span class="qr">客服<br>二维码</span>
        <span><strong>第一次做项目？客服陪你上手</strong><small>领词、下载、发布有疑问，扫码咨询</small></span>
      </button>
      <button class="x" id="csHide" type="button" aria-label="关闭客服栏">×</button>
    </div>
  </div>
  <script>
    (function () {
      var courses = [
        { title: '右豹怎么赚到收益？', line: '先了解平台，再开始做项目', cover: '认识右豹', mins: '2 分钟', tag: '建议先看', html: '<p><strong>你负责推广，平台连接项目。</strong>右豹提供合作项目与操作工具。按项目要求制作或领取内容，到短视频平台发布。</p><p><strong>发布之后，记得提交链接。</strong>部分项目需要把已发布作品的链接交回来，这叫回填。</p><p><strong>收益按项目规则计算。</strong>发布并不等于立即产生收益。参与前先看项目详情。</p>' },
        { title: '第一次做项目，从哪里开始？', line: '选项目、看规则、准备发布账号', cover: '选好项目', mins: '3 分钟', tag: '', html: '<p><strong>先确认你能在哪里发布。</strong>看项目支持的平台，确认自己有可用账号。</p><p><strong>不要只看收益数字。</strong>同时看内容要求、参与条件和结算规则。</p><p><strong>选好后，跟着项目教程做。</strong>不同项目的领取和发布要求不一样。</p>' },
        { title: '关键词、作品、回填是什么？', line: '把操作里常见的词，一次看明白', cover: '操作词典', mins: '2 分钟', tag: '', html: '<p><strong>关键词</strong>用来识别订单归属。没有关键词，就无法记录你的订单和收益。</p><p><strong>作品</strong>是你准备发布的内容。可以用官方稿件，也可以用自己的稿件。</p><p><strong>回填</strong>是把已经发布的作品链接提交回来。</p>' },
        { title: '发布后，怎么查看收益？', line: '看懂数据更新、结算与提现', cover: '查看收益', mins: '2 分钟', tag: '', html: '<p><strong>先看数据更新说明。</strong>发布后数据通常要过一段时间才同步。</p><p><strong>预估收益和已结算不是一回事。</strong>最终入账以审核和结算结果为准。</p><p><strong>提现前看账户规则。</strong>可提现金额、账户状态以提现页说明为准。</p>' }
      ];
      var projects = [
        { id: 'zhihu', name: '知乎故事', logo: 'assets/newbie/zhihu.png', rate: '10.5', book: '星河故事', keywords: ['星河故事726', '星河故事801'], manuscripts: ['故事悬念版', '人物冲突版'], publishReq: '1. 关键词与作品对应\n使用本次领取的关键词，内容要和这本书对应。\n\n2. 关键词使用方式\n把关键词放在标题或口播里，不要改字。\n\n3. 内容规范与发布平台\n画面清晰、不侵权。发到抖音等短视频平台后，回到右豹提交视频链接。' },
        { id: 'fanqie', name: '番茄小说', logo: 'assets/newbie/fanqie.png', rate: '4', book: '番茄好书', keywords: ['番茄好书518'], manuscripts: [], publishReq: '1. 关键词与作品对应\n使用本次领取的关键词，内容要和这本书对应。\n\n2. 关键词使用方式\n口播或字幕里完整出现关键词。\n\n3. 内容规范与发布平台\n按番茄小说的内容规范制作。发到抖音等短视频平台后，回到右豹提交视频链接。' },
        { id: 'hongguo', name: '红果短剧', logo: 'assets/newbie/hongguo.png', rate: '8', book: '红果看剧', keywords: [], manuscripts: ['剧情悬念版'], publishReq: '1. 关键词与作品对应\n使用本次领取的关键词，内容要和这部剧对应。\n\n2. 关键词使用方式\n标题和口播都要带上关键词。\n\n3. 内容规范与发布平台\n保留剧情悬念，不要剧透结局。发到抖音等短视频平台后，回到右豹提交视频链接。' }
      ];
      var state = { stage: 0, lesson: 0, project: 0, choosing: false, confirmed: false, pickingOwn: false, quota: 2, assigned: {}, file: {}, editor: {}, own: {}, filled: {}, play: false };
      var view = document.getElementById('view');
      var title = document.getElementById('title');
      var back = document.getElementById('back');
      var screen = 'home';
      var hosted = new URLSearchParams(location.search).get('host') === '1';

      function today() {
        var d = new Date();
        return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
      }
      function csHidden() {
        try { return localStorage.getItem('rb-newbie-cs-day') === today(); } catch (e) { return false; }
      }
      function paintCs() {
        document.getElementById('cs').hidden = csHidden();
      }
      function toast(msg) {
        var old = document.querySelector('.toast');
        if (old) old.remove();
        var el = document.createElement('div');

      }
      function celebrate() {
        dialog('<div class="eyebrow">新人实操已完成</div><h3>做得好，第一次发布完成啦！</h3><p>你已跑通领词、准备稿件、发布回填。</p><div class="soft"><strong>接下来，按这 5 步继续做项目</strong><ol class="ol"><li><span>1</span><div><b>选择项目</b><br>到变现页，选择适合自己的项目。</div></li><li><span>2</span><div><b>查看项目要求</b><br>了解参与条件、发布规范和收益规则。</div></li><li><span>3</span><div><b>申请关键词</b><br>按项目要求申请，获取关键词后再使用。</div></li><li><span>4</span><div><b>发布作品并回填</b><br>准备稿件，发布视频后提交作品链接。</div></li><li><span>5</span><div><b>等待收益产生</b><br>关注数据更新，有效收益按项目规则计算。</div></li></ol></div><p class="note">本次回填已记入。实际收益以有效数据和项目结算为准。</p><button class="primary" id="goCash" type="button">去做项目</button><button class="quiet" id="stay" type="button" style="width:100%;margin-top:8px">稍后再去</button>', function (d, close) {
          d.querySelector('#goCash').onclick = function () { close(); go('cash'); };
          d.querySelector('#stay').onclick = function () { close(); state.stage = 1; if (screen !== 'home') go('home'); };
        });
      }
      function render() {
        if (screen === 'course') course();
        else if (screen === 'apply') applyPage();
        else if (screen === 'academy') academy();
        else if (screen === 'cash') cash();
        else home();
      }
      document.getElementById('csOpen').onclick = function () {
        dialog('<h3>新手专属客服</h3><p>领词、下载稿件或发布回填遇到问题，都可以联系我们。</p><div class="qr lg">客服二维码<br>后台已配置</div><button class="primary" id="csOk" type="button">我知道了</button>', function (d, close) {
          d.querySelector('#csOk').onclick = close;
        });
      };
      document.getElementById('csHide').onclick = function () {
        try { localStorage.setItem('rb-newbie-cs-day', today()); } catch (e) {}
        paintCs();
        toast('今天不再显示，明天会再出现');
      };
      paintCs();
      var preset = new URLSearchParams(location.search).get('scene') || 'step1';
      if (preset === 'course') {
        state.lesson = 0;
        screen = 'course';
      } else if (preset === 'step2') {
        state.stage = 1;
        state.project = 0;
      } else if (preset === 'keyword' || preset === 'official') {
        state.stage = 1;
        state.project = 0;
        state.assigned.zhihu = projects[0].keywords[0];
      } else if (preset === 'refill') {
        state.stage = 1;
        state.project = 0;
        state.assigned.zhihu = projects[0].keywords[0];
        state.own.zhihu = true;
      } else if (preset === 'kw-short') {
        state.stage = 1;
        state.project = 2;
      } else if (preset === 'ms-short') {
        state.stage = 1;
        state.project = 1;
        state.assigned.fanqie = projects[1].keywords[0];
      } else if (preset === 'filled') {
        state.stage = 1;
        state.project = 0;
        state.assigned.zhihu = projects[0].keywords[0];
        state.file.zhihu = projects[0].manuscripts[0];
        state.quota = 1;
        state.filled.zhihu = true;
      }
      function scrollInside(el) {
        if (!el) return;
        var top = el.getBoundingClientRect().top - view.getBoundingClientRect().top + view.scrollTop;
        view.scrollTop = Math.max(0, top - 16);
      }
      render();
      if (preset === 'keyword') scrollInside(view.querySelector('.row-done'));
      if (preset === 'official') scrollInside(document.getElementById('pickOfficial'));
      if (preset === 'refill') openDevRule();
      if (preset === 'kw-short') claimKeyword();
      if (preset === 'ms-short') downloadOfficial();
      if (preset === 'filled') celebrate();
    })();
  </script>
</body>
</html>
