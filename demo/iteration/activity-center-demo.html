<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>活动中心 · 前端交互 Demo</title>
  <style>
    :root {
      --orange: #ff5722;
      --orange-start: #ff8a4c;
      --orange-light: #fff3eb;
      --orange-border: #ffd4b8;
      --purple-start: #7c3aed;
      --purple-end: #5b21b6;
      --bg: #f5f6f8;
      --surface: #fff;
      --inner-bg: #f3f4f6;
      --text-primary: #1a2332;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --border: #ececec;
      --radius: 12px;
      --phone-w: 375px;
      --phone-h: 812px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #e8eaed; min-height: 100vh; color: var(--text-primary);
    }
    .demo-shell { display: flex; flex-direction: column; align-items: center; padding: 20px 16px 40px; gap: 16px; }
    .demo-header { width: 100%; max-width: 960px; background: #fff; border-radius: 12px; padding: 16px 20px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
    .demo-header h1 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .demo-header p { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
    .demo-nav { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .demo-nav button {
      padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border);
      background: #fff; font-size: 12px; cursor: pointer; color: var(--text-secondary);
    }
    .demo-nav button.active, .demo-nav button:hover {
      background: var(--orange-light); border-color: var(--orange-border); color: var(--orange); font-weight: 600;
    }
    .phone-frame {
      width: var(--phone-w); height: var(--phone-h); background: var(--bg);
      border-radius: 36px; overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.18), inset 0 0 0 8px #1a1a1a; position: relative;
    }
    .phone-notch {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 120px; height: 28px; background: #1a1a1a; border-radius: 0 0 16px 16px; z-index: 100;
    }
    .screen { display: none; flex-direction: column; height: 100%; overflow: hidden; position: relative; }
    .screen.active { display: flex; }
    .nav-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 48px 16px 12px; background: var(--bg); flex-shrink: 0;
    }
    .nav-bar .back { width: 32px; height: 32px; border: none; background: none; font-size: 22px; cursor: pointer; color: var(--text-primary); }
    .nav-bar .title { font-size: 17px; font-weight: 700; flex: 1; text-align: center; margin-right: 32px; }
    .nav-bar .capsule {
      position: absolute; right: 16px; top: 48px;
      display: flex; align-items: center; gap: 6px; padding: 4px 8px;
      border: 1px solid rgba(0,0,0,.08); border-radius: 999px; background: rgba(255,255,255,.6);
    }
    .nav-bar .capsule span { width: 4px; height: 4px; border-radius: 50%; background: #333; }
    .scroll-content { flex: 1; overflow-y: auto; padding: 0 16px 24px; }
    .pinned-banner {
      position: relative; border-radius: 14px; overflow: hidden; margin-bottom: 14px;
      background: linear-gradient(135deg, var(--purple-start) 0%, var(--purple-end) 100%);
      padding: 16px; color: #fff; min-height: 132px; cursor: pointer;
    }
    .pinned-banner .banner-label {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 600; opacity: .92; margin-bottom: 8px;
    }
    .pinned-banner .banner-title { font-size: 17px; font-weight: 800; line-height: 1.35; margin-bottom: 6px; padding-right: 72px; }
    .pinned-banner .banner-sub { font-size: 12px; opacity: .88; line-height: 1.5; margin-bottom: 10px; padding-right: 72px; }
    .pinned-banner .banner-meta { font-size: 11px; opacity: .78; margin-bottom: 8px; }
    .pinned-banner .banner-thumb {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      width: 64px; height: 80px; border-radius: 8px; background: rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .pinned-banner .banner-thumb svg { width: 44px; height: 44px; opacity: .9; }
    .pinned-banner .btn-banner {
      display: inline-flex; align-items: center; justify-content: center;
      border: none; border-radius: 999px; padding: 9px 20px;
      font-size: 13px; font-weight: 700; cursor: pointer; color: var(--orange);
      background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.12);
    }
    .filter-tabs {
      display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 2px;
    }
    .filter-tabs button {
      flex-shrink: 0; border: none; background: var(--surface); color: var(--text-secondary);
      padding: 7px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer;
      box-shadow: 0 1px 3px rgba(0,0,0,.04);
    }
    .filter-tabs button.active { background: #2d3748; color: #fff; }
    .list-meta {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; font-size: 13px;
    }
    .list-meta .label { font-weight: 700; color: var(--text-primary); }
    .list-meta .count { color: var(--text-muted); font-size: 12px; }
    .activity-card {
      background: var(--surface); border-radius: var(--radius); padding: 14px;
      margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.04); position: relative;
      cursor: pointer;
    }
    .card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
    .card-top .project-label { font-size: 13px; color: var(--text-primary); }
    .card-top .project-label em { font-style: normal; color: var(--orange); font-weight: 600; }
    .card-body {
      display: flex; gap: 12px; background: var(--inner-bg); border-radius: 10px; padding: 12px;
    }
    .card-icon-wrap { position: relative; flex-shrink: 0; }
    .card-icon {
      width: 72px; height: 72px; border-radius: 10px; background: #fff;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .card-icon svg { width: 52px; height: 52px; }
    .status-badge {
      position: absolute; top: -4px; left: -4px; z-index: 2;
      font-size: 10px; font-weight: 700; color: var(--orange);
      background: #fff; border: 1px solid var(--orange-border);
      padding: 2px 6px; border-radius: 4px; white-space: nowrap;
    }
    .status-badge.ended { color: var(--text-muted); border-color: var(--border); }
    .status-badge.upcoming { color: #2563eb; border-color: #bfdbfe; background: #eff6ff; }
    .result-badge {
      position: absolute; top: 10px; right: 10px; z-index: 2;
      font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px;
    }
    .result-badge.won { color: #b45309; background: #fff7ed; border: 1px solid #fed7aa; }
    .result-badge.not_won { color: var(--text-muted); background: #f3f4f6; border: 1px solid var(--border); }
    .card-text { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .card-title { font-size: 15px; font-weight: 700; line-height: 1.4; margin-bottom: 4px; }
    .card-subtitle { font-size: 12px; color: var(--text-muted); line-height: 1.45; }
    .card-footer {
      display: flex; align-items: flex-end; justify-content: space-between;
      margin-top: 12px; gap: 10px;
    }
    .card-footer-left { flex: 1; min-width: 0; }
    .card-time { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .card-stats { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .view-count, .enroll-count { font-size: 12px; color: var(--text-secondary); display: inline-flex; align-items: center; gap: 6px; }
    .banner-stats { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
    .banner-views, .banner-enroll { font-size: 11px; opacity: .92; display: inline-flex; align-items: center; gap: 6px; }
    .btn-action {
      flex-shrink: 0; border: none; border-radius: 999px; padding: 8px 18px;
      font-size: 13px; font-weight: 700; cursor: pointer; color: #fff;
      background: linear-gradient(135deg, var(--orange-start), var(--orange));
    }
    .empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); font-size: 13px; }
    .toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: rgba(0,0,0,.78); color: #fff; padding: 10px 18px; border-radius: 999px;
      font-size: 13px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 200;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .detail-scroll { flex: 1; overflow-y: auto; padding: 0 0 88px; background: var(--bg); }
    .detail-card {
      display: flex; gap: 12px; margin: 4px 16px 12px; padding: 14px;
      background: #fff; border-radius: 14px; box-shadow: 0 1px 6px rgba(15,23,42,.06);
    }
    .detail-cover {
      width: 88px; height: 88px; border-radius: 10px; background: #fff;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .detail-cover img, .detail-cover svg { width: 88px; height: 88px; object-fit: cover; display: block; border-radius: 10px; }
    .detail-cover svg { width: 56px; height: 56px; margin: 16px; }
    .detail-cta button:disabled { opacity: .45; cursor: not-allowed; filter: grayscale(.2); }
    .detail-head-main { flex: 1; min-width: 0; }
    .detail-title { font-size: 16px; font-weight: 800; line-height: 1.4; margin-bottom: 6px; }
    .detail-time { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
    .detail-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .chip {
      font-size: 11px; padding: 3px 8px; border-radius: 999px;
      background: var(--orange-light); color: var(--orange); font-weight: 600;
    }
    .chip-project { background: #fff; border: 1px solid var(--orange-border); color: var(--text-primary); }
    .chip-project em { font-style: normal; color: var(--orange); }
    .detail-meta { font-size: 12px; color: var(--text-secondary); display: flex; gap: 12px; }
    #detailAward[hidden] { display: none !important; }
    .reward-bar {
      margin: 0 16px 12px; padding: 14px;
      border-radius: 14px;
      font-size: 13px; font-weight: 600; line-height: 1.5;
      box-shadow: 0 1px 6px rgba(15,23,42,.06);
    }
    .reward-bar.won {
      background: var(--orange-light); color: #9a3412;
      border: 1px solid var(--orange-border);
    }
    .reward-bar.not_won {
      background: #d8dce3; color: #374151;
      border: 1px solid #c5cad3;
    }
    .detail-main {
      margin: 0 16px 12px; background: #fff; border-radius: 14px;
      box-shadow: 0 1px 6px rgba(15,23,42,.06); overflow: hidden;
    }
    .detail-tabs {
      display: flex; gap: 0; margin: 0; border-bottom: 1px solid var(--border);
      background: #fff;
    }
    .detail-tabs[hidden] { display: none !important; }
    .detail-tabs button {
      flex: 1; padding: 12px 8px; border: none; background: none; cursor: pointer;
      font-size: 14px; color: var(--text-secondary); border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .detail-tabs button.active { color: var(--orange); font-weight: 700; border-bottom-color: var(--orange); }
    .detail-body { padding: 14px 16px 18px; }
    .board-empty { color: var(--text-muted); font-size: 13px; padding: 28px 0; text-align: center; }
    .board-list { background: #fff; }
    .board-row {
      display: grid;
      grid-template-columns: 40px 48px minmax(0, 1fr) auto;
      grid-template-rows: auto auto;
      column-gap: 10px;
      align-items: center;
      padding: 14px 0; border-bottom: 1px solid #f3f4f6;
    }
    .board-row:last-child { border-bottom: none; }
    .board-rank {
      grid-column: 1; grid-row: 1; width: 40px;
      display: flex; align-items: center; justify-content: center;
    }
    .board-av-wrap { grid-column: 2; grid-row: 1; position: relative; width: 48px; height: 48px; }
    .board-top {
      font-size: 9px; font-weight: 800; letter-spacing: .02em;
      padding: 2px 5px; border-radius: 6px; color: #fff; line-height: 1.2;
    }
    .board-top.is-1 { background: linear-gradient(180deg, #ff8a3d, #ff5722); }
    .board-top.is-2 { background: linear-gradient(180deg, #ffb347, #f59e0b); }
    .board-top.is-3 { background: linear-gradient(180deg, #f0b27a, #d97706); }
    .board-num {
      font-size: 15px; font-weight: 700; color: #9ca3af; line-height: 1;
    }
    .board-av {
      width: 48px; height: 48px; border-radius: 50%; object-fit: cover;
      background: #e5e7eb; display: block;
    }
    .board-av-fallback {
      width: 48px; height: 48px; border-radius: 50%;
      color: #fff; font-size: 16px; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .board-av-wrap .board-av-fallback {
      position: absolute; inset: 0; width: 48px; height: 48px;
    }
    .board-av + .board-av-fallback { display: none !important; }
    .board-nick { grid-column: 3; grid-row: 1; font-size: 15px; font-weight: 800; line-height: 1.3; color: #111827; min-width: 0; }
    .board-val { grid-column: 4; grid-row: 1; font-size: 16px; font-weight: 800; color: #f97316; text-align: right; }
    .board-metric, .board-period {
      font-size: 11px; color: #9ca3af; font-weight: 400; margin: 0; line-height: 1.3;
    }
    .board-metric { grid-column: 3; grid-row: 2; }
    .board-period { grid-column: 4; grid-row: 2; text-align: right; }
    .board-me {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 4;
      display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; grid-template-rows: auto auto;
      column-gap: 10px; align-items: center;
      padding: 10px 16px 18px; background: rgba(255,255,255,.96);
      box-shadow: 0 -8px 24px rgba(15,23,42,.08);
    }
    .board-me[hidden] { display: none !important; }
    .board-me .board-av, .board-me .board-av-fallback {
      grid-column: 1; grid-row: 1; width: 40px; height: 40px; font-size: 14px;
    }
    .me-name { grid-column: 2; grid-row: 1; font-size: 15px; font-weight: 800; }
    .me-val { grid-column: 3; grid-row: 1; font-size: 15px; font-weight: 800; color: #f97316; text-align: right; }
    .me-rank { grid-column: 2; grid-row: 2; font-size: 12px; color: #9ca3af; font-weight: 400; margin: 0; }
    .me-period { grid-column: 3; grid-row: 2; font-size: 11px; color: #9ca3af; text-align: right; }
    .case-lightbox {
      position: fixed; inset: 0; z-index: 700; background: rgba(15,23,42,.72);
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .case-lightbox[hidden] { display: none !important; }
    .case-lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
    .case-media img { cursor: zoom-in; }
    .intro-html { font-size: 14px; line-height: 1.7; color: var(--text-primary); }
    .intro-html p { margin-bottom: 10px; }
    .case-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .case-block { margin: 0; min-width: 0; }
    .case-name { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
    .case-media { display: flex; flex-direction: column; gap: 8px; }
    .case-media img, .case-media video {
      width: 100%; border-radius: 10px; background: #e5e7eb; display: block;
    }
    .detail-cta {
      position: absolute; left: 0; right: 0; bottom: 0;
      display: flex; gap: 10px; padding: 12px 16px 20px;
      background: linear-gradient(180deg, rgba(245,246,248,0), var(--bg) 28%, var(--bg));
    }
    .detail-cta[hidden] { display: none !important; }
    .detail-cta button {
      flex: 1; border: none; border-radius: 999px; padding: 12px 10px;
      font-size: 14px; font-weight: 700; cursor: pointer; color: #fff;
      background: linear-gradient(135deg, var(--orange-start), var(--orange));
    }
    .detail-cta button.ghost {
      background: #fff; color: var(--orange); border: 1px solid var(--orange-border);
    }
    body.embed-mode { background: var(--bg); margin: 0; }
    body.embed-mode .demo-header { display: none !important; }
    body.embed-mode .demo-nav { display: none !important; }
    body.embed-mode .demo-shell { padding: 0; min-height: 100vh; }
    body.embed-mode .phone-frame { width: 100%; max-width: 100%; height: 100vh; border-radius: 0; box-shadow: none; border: none; }
    body.embed-mode .phone-notch { display: none; }
    body.embed-mode .nav-bar { padding-top: 12px; }
    body.embed-mode .nav-bar .capsule { top: 12px; }
  </style>
</head>
<body>
  <div class="demo-shell">
    <div class="demo-header">
      <h1>活动中心 · 前端交互 Demo</h1>
      <p>「查看」只进详情。领取仅介绍 Tab 且进行中可点；跳转失败不记。无待开始筛选。榜单由后台开关控制。展位只看第 2 步 showUserAward，不绑榜单。封面来自后台「封面」。</p>
      <div class="demo-nav" id="screenNav">
        <button type="button" class="active" data-filter="all">全部活动</button>
        <button type="button" data-filter="ongoing">进行中</button>
        <button type="button" data-filter="ended">已结束</button>
        <button type="button" data-filter="participated">已参与</button>
      </div>
    </div>
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screen active" id="screen-activity-center">
        <div class="nav-bar">
          <button class="back" type="button" aria-label="返回">‹</button>
          <div class="title">活动中心</div>
          <div class="capsule" aria-hidden="true"><span></span><span></span><span></span></div>
        </div>
        <div class="scroll-content">
          <div id="pinnedBanner"></div>
          <div class="filter-tabs" id="filterTabs">
            <button type="button" class="active" data-filter="all">全部</button>
            <button type="button" data-filter="ongoing">进行中</button>
            <button type="button" data-filter="ended">已结束</button>
            <button type="button" data-filter="participated">已参与</button>
          </div>
          <div class="list-meta">
            <span class="label">全部活动</span>
            <span class="count" id="listCount">共 0 条</span>
          </div>
          <div id="activityList"></div>
          <div class="empty-state" id="emptyState" hidden>暂无符合条件的活动</div>
        </div>
      </div>
      <div class="screen" id="screen-detail">
        <div class="nav-bar">
          <button class="back" type="button" id="detailBack" aria-label="返回">‹</button>
          <div class="title">活动详情</div>
          <div class="capsule" aria-hidden="true"><span></span><span></span><span></span></div>
        </div>
        <div class="detail-scroll">
          <div class="detail-card" id="detailHead"></div>
          <div id="detailAward"></div>
          <div class="detail-main" id="detailMain">
            <div class="detail-tabs" id="detailTabs" hidden></div>
            <div class="detail-body" id="detailBody"></div>
          </div>
        </div>
        <div class="detail-cta" id="detailCta" hidden></div>
        <div class="board-me" id="boardMe" hidden></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="case-lightbox" id="caseLightbox" hidden>
    <img id="caseLightboxImg" alt="案例大图" />
  </div>

  <script>
    const ICON_SVG = '<svg viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="12" fill="#fff"/><path d="M32 10c8 6 14 14 14 24 0 8-6 14-14 16-8-2-14-8-14-16C18 24 24 16 32 10z" fill="#ff5722"/><circle cx="38" cy="28" r="4" fill="#fff"/></svg>';
    const CASE_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#ff8a4c"/><stop offset="1" stop-color="#ff5722"/></linearGradient></defs><rect width="640" height="280" fill="url(#g)"/><text x="320" y="150" text-anchor="middle" fill="#fff" font-size="28" font-family="sans-serif">活动案例</text></svg>');
    const CASE_VIDEO = 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4';
    const COVER_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="176" height="176" viewBox="0 0 176 176"><defs><linearGradient id="c" x1="0" x2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#ff5722"/></linearGradient></defs><rect width="176" height="176" rx="20" fill="url(#c)"/><text x="88" y="96" text-anchor="middle" fill="#fff" font-size="22" font-family="sans-serif">封面</text></svg>');

    const MOCK_LEADERBOARD = [
      { nicknameMasked: '****山', avatarUrl: 'https://i.pravatar.cc/96?img=12', value: '99999.99元' },
      { nicknameMasked: '****发', avatarUrl: 'https://i.pravatar.cc/96?img=32', value: '99999.99元' },
      { nicknameMasked: '****8', avatarUrl: 'https://i.pravatar.cc/96?img=5', value: '99999.99元' },
      { nicknameMasked: '****子', avatarUrl: 'https://i.pravatar.cc/96?img=47', value: '99999.99元' },
      { nicknameMasked: '叶**城', avatarUrl: 'https://i.pravatar.cc/96?img=48', value: '99999.99元' },
      { nicknameMasked: 'a**8', avatarUrl: 'https://i.pravatar.cc/96?img=15', value: '88888.00元' },
      { nicknameMasked: '林**七', avatarUrl: 'https://i.pravatar.cc/96?img=20', value: '77777.00元' },

        'detail-intro': 'a3',
        'detail-not-won': 'a8',
        'detail-upcoming': 'a4',
        'detail-ended': 'a6',
        'detail-jump-fail': 'a7'
      })[scene];
      const screen = params.get('screen') || (scene.indexOf('detail') === 0 ? 'detail' : '');
      const id = params.get('id') || sceneId || '';
      if (screen === 'detail' && id) openDetail(id);
    }

    applyParams(new URLSearchParams(location.search));

    window.addEventListener('message', e => {
      const data = e.data || {};
      if (data.type === 'setFilter' && ['all', 'ongoing', 'ended', 'participated'].includes(data.filter)) {
        showList();
        setFilter(data.filter);
      }
      if (data.type === 'openDetail' && data.id) openDetail(data.id);
      if (data.type === 'setScreen') {
        if (data.screen === 'detail' && data.id) openDetail(data.id);
        if (data.screen === 'list') {
          if (data.filter) setFilter(data.filter);
          showList();
        }
      }
    });
  </script>
</body>
</html>
