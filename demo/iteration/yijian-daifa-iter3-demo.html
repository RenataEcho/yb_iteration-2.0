  <style>
    /* 视觉沿用一键代发 1.0：yijian-daifa-demo.html / yijian-daifa-pc.html，不另起配色和组件 */
    :root {

          pendingToast = '领取成功，当时不分钱';
          draw();
        });
      });
    }
    if (boot === 'detail-own-pick') {
      view = 'detail-own-pick';
      currentId = 'p7';
      ownPickOpen = true;
    }
    if (boot === 'detail-own-hold') {
      view = 'detail-own-hold';
      currentId = 'p7';
      var heldWork = findWork('p7');
      heldWork.got = [true];
      heldWork.keywordOut = false;
      quotaLeft = 0;
      ownHoldPop = true;
      claimRows.unshift({ id: 'c4', work: 'p7', kwState: 'fill', status: '未回填', time: '刚刚', downloadedAt: 0, expireAt: now + 2 * 86400000, fills: [], backfillPrompted: false });
    }
    if (boot === 'claims-fill' || boot === 'claims-fill-sheet' || boot === 'claims-fill-block') {
      view = boot;
      claimStatus = '未回填';
      claimRows.unshift({ id: 'c4', work: 'p7', kwState: 'fill', status: '未回填', time: '刚刚', downloadedAt: 0, expireAt: now + 2 * 86400000, fills: [], backfillPrompted: false });
      var fillWork = findWork('p7');
      fillWork.got = [true];
      fillWork.keywordOut = false;
      if (boot === 'claims-fill-sheet') kwSheetClaimId = 'c4';
      if (boot === 'claims-fill-block') kwDlTip = true;
    }
    if (boot === 'claims-timeout') {
      view = 'claims-timeout';
      claimStatus = '未回填';
      claimRows.unshift({ id: 'c5', work: 'p18', kwState: 'timeout', status: '未回填', time: '1小时前', downloadedAt: 0, expireAt: now + 2 * 86400000, fills: [], backfillPrompted: false });
      var timeoutWork = findWork('p18');
      timeoutWork.got = [true];
      timeoutWork.keywordOut = false;
    }
    draw();
  </script>
</body>
