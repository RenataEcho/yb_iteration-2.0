<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>别名绑定 · 前端交互 Demo</title>
  <style>
    :root {
      --orange: #ff5a2d;
      --bg: #f4f5f7;
      --text: #1c2430;
      --muted: #8b93a0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #e8eaed; color: var(--text); min-height: 100vh;
    }
    .demo-shell { display: flex; flex-direction: column; align-items: center; padding: 20px 16px 32px; gap: 14px; }
    .demo-header { width: 100%; max-width: 420px; background: #fff; border-radius: 12px; padding: 14px 16px; }
    .demo-header h1 { font-size: 16px; margin-bottom: 4px; }
    .demo-header p { font-size: 12px; color: #64748b; line-height: 1.5; }
    .phone {
      width: 375px; height: 812px; background: #f7f8fa; border-radius: 44px; overflow: hidden;
      box-shadow: 0 24px 50px rgba(0,0,0,.22), 0 0 0 11px #1c1c1e, 0 0 0 12px #3a3a3c;
      position: relative;
    }
    .ios-bar {
      height: 54px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; background: #f7f8fa; position: relative; color: #111;
    }
    .ios-time { font-size: 15px; font-weight: 650; letter-spacing: -.3px; line-height: 1; }
    .island {
      position: absolute; left: 50%; top: 11px; transform: translateX(-50%);
      width: 108px; height: 32px; background: #000; border-radius: 20px;
    }
    .ios-sys { display: flex; align-items: center; gap: 5px; color: #111; }
    .ios-sys svg { display: block; }
    .screen { display: none; flex-direction: column; height: 100%; background: #f7f8fa; }
    .screen.active { display: flex; }
    .nav {
      display: grid; grid-template-columns: 88px 1fr 88px; align-items: center;
      padding: 2px 6px 10px; background: #f7f8fa; flex-shrink: 0;
    }
    .nav .side {
      width: 44px; height: 32px; border: none; background: none; color: #111;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .nav h1 { font-size: 17px; font-weight: 600; text-align: center; letter-spacing: -.2px; }
    .apply-btn {
      justify-self: end; height: 32px; padding: 0 8px 0 0; border: none; background: none;
      color: var(--orange); font-size: 15px; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .scroll { flex: 1; overflow: auto; background: #f7f8fa; }
    .home-ind {
      position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
      width: 134px; height: 5px; border-radius: 999px; background: #111; z-index: 7; pointer-events: none;
    }
    .page-pad { padding: 4px 16px 36px; }
    .rec { background: #fff; border-radius: 16px; padding: 16px 14px; margin-bottom: 10px; }
    .rec-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .rec-title { font-size: 16px; font-weight: 800; line-height: 1.4; }
    .st { font-size: 12px; font-weight: 700; white-space: nowrap; }
    .st-pending { color: #d97706; }
    .st-ok { color: #16a34a; }
    .st-no { color: #dc2626; }
    .rec-lines { margin-top: 8px; font-size: 12px; color: #9aa3af; line-height: 1.75; }
    .empty {
      min-height: 100%; display: flex; flex-direction: column; align-items: center;
      text-align: center; padding: 72px 28px 40px; color: var(--muted);
    }
    .empty svg { width: 120px; height: 96px; margin-bottom: 16px; }
    .empty b { display: block; font-size: 15px; color: var(--text); margin-bottom: 6px; }
    .empty p { font-size: 12px; line-height: 1.5; }
    .mask {
      position: absolute; inset: 0; background: rgba(0,0,0,.4); z-index: 8;
      display: none; align-items: flex-end; justify-content: center;
    }
    .mask.open { display: flex; }
    .dialog { width: 100%; background: #fff; border-radius: 14px 14px 0 0; padding: 8px 16px 36px; }
    .grab { width: 36px; height: 5px; border-radius: 99px; background: #d1d5db; margin: 4px auto 12px; }
    .dialog h3 { font-size: 16px; margin-bottom: 4px; }
    .hint { font-size: 12px; color: var(--muted); line-height: 1.5; }
    label.f { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 6px; }
    input[type="text"] {
      width: 100%; height: 44px; border: 1px solid #ececec; border-radius: 10px; padding: 0 12px; font-size: 15px;
    }
    .preview { margin-top: 8px; font-size: 12px; color: var(--muted); min-height: 18px; }
    .preview b { color: var(--text); }
    .dialog-actions { display: flex; gap: 8px; margin-top: 16px; }
    button.go, button.cancel { flex: 1; height: 44px; border-radius: 999px; font-size: 15px; font-weight: 700; cursor: pointer; }
    button.go { border: none; background: var(--orange); color: #fff; }
    button.cancel { border: 1px solid #ececec; background: #fff; color: var(--muted); }
    .toast {
      position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(12px);
      background: #1e293b; color: #fff; font-size: 13px; padding: 8px 14px; border-radius: 999px;
      opacity: 0; pointer-events: none; transition: .2s; z-index: 9; max-width: 300px; text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    body.embed-mode { background: var(--bg); }
    body.embed-mode .demo-header { display: none; }
    body.embed-mode .demo-shell { padding: 0; }
    body.embed-mode .phone { width: 100%; height: 100vh; border-radius: 0; box-shadow: none; }
  </style>
</head>
<body>
  <div class="demo-shell">
    <div class="demo-header">
      <h1>别名绑定 · 申请记录</h1>
      <p>只看申请记录。右上角申请别名。另有一张没有记录的缺省页。</p>
    </div>
    <div class="phone">
      <section class="screen active" id="screen-records">
        <div class="ios-bar">
          <span class="ios-time">9:41</span>
          <span class="island" aria-hidden="true"></span>
          <span class="ios-sys" aria-hidden="true">
            <svg width="17" height="12" viewBox="0 0 17 12"><rect x="0" y="7" width="3" height="5" rx=".6" fill="currentColor"/><rect x="4.5" y="4.5" width="3" height="7.5" rx=".6" fill="currentColor"/><rect x="9" y="2.2" width="3" height="9.8" rx=".6" fill="currentColor"/><rect x="13.5" y="0" width="3" height="12" rx=".6" fill="currentColor"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12"><path fill="currentColor" d="M8 2.8c1.8 0 3.4.7 4.6 1.8l1.1-1.2A8.2 8.2 0 0 0 8 .8a8.2 8.2 0 0 0-5.7 2.6L3.4 4.6A6.4 6.4 0 0 1 8 2.8Zm0 3.2c1 0 1.9.4 2.6 1l1.1-1.2a5.2 5.2 0 0 0-7.4 0L5.4 7A3.6 3.6 0 0 1 8 6Zm0 3.2a1.15 1.15 0 1 0 0 2.3 1.15 1.15 0 0 0 0-2.3Z"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12"><rect x=".6" y=".6" width="21" height="10.8" rx="2.4" fill="none" stroke="currentColor" stroke-opacity=".45"/><rect x="2" y="2" width="16" height="8" rx="1.2" fill="currentColor"/><path fill="currentColor" fill-opacity=".45" d="M23.2 4v4a1.8 1.8 0 0 0 0-4Z"/></svg>
          </span>
        </div>
        <div class="nav">
          <button class="side" type="button" aria-label="返回"><svg width="12" height="20" viewBox="0 0 12 20"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <h1>申请记录</h1>
          <button class="apply-btn" type="button" id="openApply">申请别名</button>
        </div>
        <div class="scroll"><div class="page-pad" id="recordList"></div></div>
      </section>
      <section class="screen" id="screen-empty">
        <div class="ios-bar">
          <span class="ios-time">9:41</span>
          <span class="island" aria-hidden="true"></span>
          <span class="ios-sys" aria-hidden="true">
            <svg width="17" height="12" viewBox="0 0 17 12"><rect x="0" y="7" width="3" height="5" rx=".6" fill="currentColor"/><rect x="4.5" y="4.5" width="3" height="7.5" rx=".6" fill="currentColor"/><rect x="9" y="2.2" width="3" height="9.8" rx=".6" fill="currentColor"/><rect x="13.5" y="0" width="3" height="12" rx=".6" fill="currentColor"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12"><path fill="currentColor" d="M8 2.8c1.8 0 3.4.7 4.6 1.8l1.1-1.2A8.2 8.2 0 0 0 8 .8a8.2 8.2 0 0 0-5.7 2.6L3.4 4.6A6.4 6.4 0 0 1 8 2.8Zm0 3.2c1 0 1.9.4 2.6 1l1.1-1.2a5.2 5.2 0 0 0-7.4 0L5.4 7A3.6 3.6 0 0 1 8 6Zm0 3.2a1.15 1.15 0 1 0 0 2.3 1.15 1.15 0 0 0 0-2.3Z"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12"><rect x=".6" y=".6" width="21" height="10.8" rx="2.4" fill="none" stroke="currentColor" stroke-opacity=".45"/><rect x="2" y="2" width="16" height="8" rx="1.2" fill="currentColor"/><path fill="currentColor" fill-opacity=".45" d="M23.2 4v4a1.8 1.8 0 0 0 0-4Z"/></svg>
          </span>
        </div>
        <div class="nav">
          <button class="side" type="button" aria-label="返回"><svg width="12" height="20" viewBox="0 0 12 20"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <h1>申请记录</h1>
          <button class="apply-btn" type="button" id="openApplyEmpty">申请别名</button>
        </div>
        <div class="scroll">
          <div class="empty">
            <svg viewBox="0 0 120 96" fill="none" aria-hidden="true">
              <rect x="22" y="18" width="76" height="58" rx="10" fill="#fff" stroke="#e5e7eb" stroke-width="2"/>
              <path d="M38 40h44M38 52h28" stroke="#d1d5db" stroke-width="3" stroke-linecap="round"/>
              <circle cx="86" cy="62" r="16" fill="#fff1ea" stroke="#ffc9b0" stroke-width="2"/>
              <path d="M86 54v10M81 59h10" stroke="#ff5a2d" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <b>暂无申请记录</b>
            <p>还没有申请过别名<br>点右上角申请别名</p>
          </div>
        </div>
      </section>
      <div class="home-ind" aria-hidden="true"></div>
      <div class="mask" id="applyMask">
        <div class="dialog" role="dialog" aria-label="申请别名">
          <div class="grab"></div>
          <h3>申请别名</h3>
          <p class="hint">自己输入。提交后进入审核，通过才生效。</p>
          <label class="f" for="aliasInput">别名</label>
          <input id="aliasInput" type="text" maxlength="32" placeholder="输入想用的别名" />
          <div class="preview" id="preview"></div>
          <div class="dialog-actions">
            <button class="cancel" type="button" id="cancelApply">取消</button>
            <button class="go" type="button" id="submitBtn">提交申请</button>
          </div>
        </div>
      </div>
      <div class="toast" id="toast"></div>
    </div>
  </div>
  <script src="alias-bind-store.js"></script>
  <script>
    var params = new URLSearchParams(location.search);
    var toastTimer;
    var extra = [];
    var MOCK = [
      { alias: '番茄小说', status: '申请中', at: '2026-09-26 16:22', reviewedAt: '' },
      { alias: '红果', status: '已通过', at: '2026-09-12 10:18', reviewedAt: '2026-09-12 11:02' },
      { alias: '山楂', status: '已驳回', at: '2026-09-08 09:20', reviewedAt: '2026-09-08 15:06' }
    ];

    function toast(msg) {
      var el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
    }

    function statusClass(status) {
      if (status === '已通过') return 'st-ok';
      if (status === '已驳回') return 'st-no';
      return 'st-pending';
    }

    function card(row) {
      return '<article class="rec"><div class="rec-top"><div class="rec-title">' + row.alias + '</div>' +
        '<span class="st ' + statusClass(row.status) + '">' + row.status + '</span></div>' +
        '<div class="rec-lines">申请时间 ' + row.at + '<br>审核时间 ' + (row.reviewedAt || '—') + '</div></article>';
    }

    function render() {
      document.getElementById('recordList').innerHTML = extra.concat(MOCK).map(card).join('');
    }

    function nowStr() {
      var d = new Date();
      function p(n) { return String(n).padStart(2, '0'); }
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    }

    function paintPreview() {
      var raw = document.getElementById('aliasInput').value;
      var alias = String(raw || '').replace(/ /g, '');
      var box = document.getElementById('preview');
      if (!raw) { box.textContent = ''; return; }
      box.innerHTML = alias ? '去掉空格后提交：<b>' + alias + '</b>' : '去掉空格后是空的，不能提交';
    }

    function openApply(open) {
      document.getElementById('applyMask').classList.toggle('open', open);
      if (open) document.getElementById('aliasInput').focus();
    }

    function setScreen(name) {
      var screen = name === 'empty' ? 'empty' : 'records';
      document.getElementById('screen-records').classList.toggle('active', screen === 'records');
      document.getElementById('screen-empty').classList.toggle('active', screen === 'empty');
      openApply(false);
    }

    document.getElementById('openApply').addEventListener('click', function () { openApply(true); });
    document.getElementById('openApplyEmpty').addEventListener('click', function () { openApply(true); });
    document.getElementById('cancelApply').addEventListener('click', function () { openApply(false); });
    document.getElementById('applyMask').addEventListener('click', function (e) {
      if (e.target.id === 'applyMask') openApply(false);
    });
    document.getElementById('aliasInput').addEventListener('input', paintPreview);
    document.getElementById('submitBtn').addEventListener('click', function () {
      var alias = String(document.getElementById('aliasInput').value || '').replace(/ /g, '');
      if (!alias) { toast('去掉空格后是空的，不能提交'); return; }
      var res = AliasBind.submitH5('U10088', alias);
      if (!res.ok) { toast(res.message); return; }
      var onEmpty = document.getElementById('screen-empty').classList.contains('active');
      if (!onEmpty) extra.unshift({ alias: res.alias, status: '申请中', at: nowStr(), reviewedAt: '' });
      document.getElementById('aliasInput').value = '';
      paintPreview();
      openApply(false);
      render();
      toast('已提交，等待审核');
    });
    window.addEventListener('message', function (e) {
      if (e.data && e.data.type === 'setScreen') setScreen(e.data.screen);
    });

    if (params.get('embed') === '1') document.body.classList.add('embed-mode');
    render();
    setScreen(params.get('screen') || 'records');
  </script>
</body>
</html>
