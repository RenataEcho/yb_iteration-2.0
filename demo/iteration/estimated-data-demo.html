<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>预估数据 · C 端数据查询 Demo</title>
  <style>
    :root {
      --orange-start: #ff8a75;
      --orange-end: #f07167;
      --text-primary: #18222f;
      --text-secondary: #64748b;
      --text-muted: #9aa5b4;
      --border: #e8edf3;
      --bg: #eef1f5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 13px; color: var(--text-primary);
      background: var(--bg); min-height: 100vh;
    }
    .demo-header {
      padding: 16px; text-align: center;
      background: #fff; border-bottom: 1px solid var(--border);
    }
    .demo-header h1 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .demo-header p { font-size: 11px; color: var(--text-muted); line-height: 1.45; }
    .demo-nav {
      display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px;
    }
    .demo-nav button {
      padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px;
      background: #fff; font-size: 11px; cursor: pointer; color: #64748b;
    }
    .demo-nav button.active {
      background: #ffe8e3; border-color: #fecaca; color: #e65100; font-weight: 600;
    }
    .screen { display: none; padding: 12px 12px 20px; min-height: calc(100vh - 80px); }
    .screen.active { display: block; }

    .fe-header { margin-bottom: 16px; }
    .fe-back-btn {
      width: 32px; height: 32px; border: none; background: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center; color: #18222f;
      border-radius: 8px; flex-shrink: 0; margin-bottom: 10px; padding: 0;
    }
    .fe-back-btn:active { background: rgba(0,0,0,0.05); }
    .fe-back-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .fe-header-main {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .fe-filter-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      flex-shrink: 0; height: 36px; padding: 0 14px;
      border: 1px solid var(--border); border-radius: 10px; background: #fff; cursor: pointer;
      font-size: 13px; font-weight: 600; color: var(--text-primary);
      box-shadow: 0 1px 4px rgba(30,40,80,0.06);
    }
    .fe-filter-btn:active { background: #fafafa; }
    .fe-filter-btn .chev { font-size: 10px; color: var(--text-muted); transition: transform .2s; }
    .fe-filter-btn.open .chev { transform: rotate(180deg); }

    /* 项目切换行 */
    .fe-project-row {
      display: flex; align-items: center; gap: 10px;
      border: none; background: none; cursor: pointer; text-align: left;
      flex: 1; min-width: 0; padding: 0;
    }
    .fe-project-row:active { opacity: 0.75; }
    .fe-project-icon {
      width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .fe-project-meta { flex: 1; min-width: 0; }
    .fe-project-meta .sub { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
    .fe-project-meta .name {
      font-size: 17px; font-weight: 800; color: var(--text-primary);
      display: flex; align-items: center; gap: 4px;
    }
    .fe-project-meta .name .chev { font-size: 14px; color: #cbd5e1; font-weight: 400; }

    /* 统计区 */
    .fe-stat-hero {
      background: #fff; border-radius: 16px; padding: 16px 14px 14px; margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(30,40,80,0.06); text-align: center;
    }
    .fe-stat-hero .label {
      font-size: 12px; color: var(--text-secondary); line-height: 1.45; margin-bottom: 10px;
    }
    .fe-stat-hero .val { font-size: 32px; font-weight: 800; color: var(--text-primary); line-height: 1; margin-bottom: 10px; }
    .fe-stat-hero .hint { font-size: 10px; color: var(--text-muted); line-height: 1.45; }
    .fe-stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .fe-stat-mini {
      background: #fff; border-radius: 14px; padding: 12px 8px 14px;
      box-shadow: 0 2px 8px rgba(30,40,80,0.05); text-align: center;
    }
    .fe-stat-mini .val { font-size: 20px; font-weight: 800; color: var(--text-primary); line-height: 1.2; margin-bottom: 6px; }
    .fe-stat-mini .name { font-size: 10px; color: var(--text-secondary); line-height: 1.35; }

    /* 明细区 */
    .fe-detail-section-title {
      font-size: 14px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; padding: 0 2px;
    }
    .fe-detail-card {
      background: #fff; border-radius: 16px; padding: 14px; margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(30,40,80,0.06);
    }
    .fe-detail-card:last-child { margin-bottom: 0; }
    .fe-detail-title {
      font-size: 15px; font-weight: 700; color: var(--text-primary); line-height: 1.35; margin-bottom: 10px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .fe-detail-data {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      background: #f5f6f8; border-radius: 10px; padding: 12px 8px; margin-bottom: 8px;
    }
    .fe-detail-data .cell-value {
      font-size: 13px; font-weight: 700; color: var(--text-primary); word-break: break-all; line-height: 1.35; margin-bottom: 4px;
    }
    .fe-detail-data .cell-value.link { color: #2563eb; }
    .fe-detail-data .cell-sub { font-size: 10px; color: var(--text-muted); margin-top: -2px; margin-bottom: 4px; font-weight: 400; }
    .fe-detail-data .cell-label { font-size: 10px; color: var(--text-muted); line-height: 1.3; }
    .fe-detail-foot { font-size: 11px; color: var(--text-muted); }
    .fe-detail-empty {
      padding: 28px 12px; text-align: center; font-size: 12px; color: var(--text-muted);
      background: #fff; border-radius: 14px;
    }

    /* 项目选择浮层 */
    .fe-project-picker-overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,0.45); z-index: 300;
      display: none; align-items: flex-end; justify-content: center;
    }
    .fe-project-picker-overlay.open { display: flex; }
    .fe-project-picker-sheet {
      width: 100%; max-width: 420px; max-height: 72vh; background: #fff;
      border-radius: 16px 16px 0 0; overflow: hidden; display: flex; flex-direction: column;
    }
    .fe-project-picker-head {
      padding: 14px 16px 10px; font-size: 14px; font-weight: 700; color: #18222f;
      border-bottom: 1px solid #e8edf3; flex-shrink: 0;
    }
    .fe-project-picker-list { overflow-y: auto; padding: 6px 0 12px; }
    .fe-project-picker-item {
      display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 16px;
      border: none; background: none; cursor: pointer; text-align: left;
    }
    .fe-project-picker-item:hover { background: #f8fafc; }
    .fe-project-picker-item.active { background: #fff4eb; }
    .fe-project-picker-item .icon {
      width: 36px; height: 36px; border-radius: 9px; background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .fe-project-picker-item .label { font-size: 13px; font-weight: 600; color: #18222f; flex: 1; min-width: 0; }
    .fe-project-picker-item .check { font-size: 14px; color: #f07167; font-weight: 700; flex-shrink: 0; }

    /* 筛选底部弹窗 */
    .fe-filter-overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,0.45); z-index: 310;
      display: none; align-items: flex-end; justify-content: center;
    }
    .fe-filter-overlay.open { display: flex; }
    .fe-filter-sheet {
      width: 100%; max-width: 420px; background: #fff;
      border-radius: 20px 20px 0 0; padding: 0 16px 24px;
      max-height: 85vh; overflow-y: auto;
    }
    .fe-filter-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 0 14px; border-bottom: 1px solid var(--border); margin-bottom: 16px;
    }
    .fe-filter-head h3 { font-size: 16px; font-weight: 700; }
    .fe-filter-close {
      width: 28px; height: 28px; border: none; background: none; cursor: pointer;
      font-size: 20px; color: var(--text-muted); line-height: 1;
    }
    .fe-field { margin-bottom: 16px; }
    .fe-field-label {
      display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600;
      color: var(--text-primary); margin-bottom: 8px;
    }
    .fe-field-label i { width: 6px; height: 6px; border-radius: 50%; background: #f07167; display: inline-block; }
    .fe-select-wrap { position: relative; }
    .fe-select {
      width: 100%; height: 42px; border: 1px solid var(--border); border-radius: 12px;
      background: #f8fafc; padding: 0 36px 0 12px; font-size: 13px; color: var(--text-primary);
      appearance: none; cursor: pointer;
    }
    .fe-select-wrap::after {
      content: '⌄'; position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); pointer-events: none; font-size: 14px;
    }
    .fe-input-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .fe-input {
      flex: 1; height: 42px; border: 1px solid var(--border); border-radius: 12px;
      background: #f8fafc; padding: 0 12px; font-size: 13px; color: var(--text-primary);
    }
    .fe-input::placeholder { color: var(--text-muted); }
    .fe-input-full {
      width: 100%; height: 42px; border: 1px solid var(--border); border-radius: 12px;
      background: #f8fafc; padding: 0 12px; font-size: 13px; color: var(--text-primary);
    }
    .fe-sep { font-size: 13px; color: var(--text-muted); flex-shrink: 0; }
    .fe-btn-query {
      width: 100%; height: 46px; margin-top: 8px; border: none; border-radius: 14px;
      background: linear-gradient(135deg, var(--orange-start), var(--orange-end)); color: #fff;
      font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 14px rgba(240,113,103,0.35);
    }
    .fe-custom-range { display: none; }
    .fe-custom-range.show { display: block; }

    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(12px);
      background: #18233f; color: #fff; border-radius: 999px; padding: 10px 16px; font-size: 12px;
      opacity: 0; pointer-events: none; transition: .22s; z-index: 400; max-width: 90vw; text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    body.embed-mode .demo-header { display: none !important; }
    body.embed-mode .screen { min-height: 100vh; }
  </style>
</head>
<body>
  <div class="demo-header">
    <h1>预估数据 · C 端「数据查询」Demo</h1>
    <p>点击项目切换 · 筛选底部弹窗 · 统计首项大卡 + 三列小卡 · 明细值上标签下</p>
    <div class="demo-nav">
      <button type="button" class="active" data-screen="screen-data-query">数据查询 · 默认态</button>
      <button type="button" data-screen="screen-filter-open">筛选弹窗展开</button>
      <button type="button" data-screen="screen-empty-result">无明细空态</button>
    </div>
  </div>

  <div id="screen-data-query" class="screen active"></div>
  <div id="screen-filter-open" class="screen"></div>
  <div id="screen-empty-result" class="screen"></div>

  <div class="fe-project-picker-overlay" id="projectPickerOverlay" onclick="closeProjectPicker()">
    <div class="fe-project-picker-sheet" onclick="event.stopPropagation()">
      <div class="fe-project-picker-head">选择项目</div>
      <div class="fe-project-picker-list" id="projectPickerList"></div>
    </div>
  </div>

  <div class="fe-filter-overlay" id="filterOverlay" onclick="closeFilterSheet()">
    <div class="fe-filter-sheet" onclick="event.stopPropagation()">
      <div class="fe-filter-head">
        <h3>筛选</h3>
        <button type="button" class="fe-filter-close" onclick="closeFilterSheet()" aria-label="关闭">×</button>
      </div>
      <div class="fe-field">
        <div class="fe-field-label"><i></i>时间范围</div>
        <div class="fe-select-wrap">
          <select class="fe-select" id="filterTimeRange" onchange="onTimeRangeChange()">
            <option value="today">今日</option>
            <option value="7d">近7天</option>
            <option value="15d">近15天</option>
            <option value="30d" selected>近30天</option>
            <option value="month">本月</option>
            <option value="custom">自定义</option>
          </select>
        </div>
        <div class="fe-custom-range" id="customRange">
          <div class="fe-input-row">
            <input class="fe-input" type="text" id="filterStartDate" placeholder="开始日期" />
            <span class="fe-sep">至</span>
            <input class="fe-input" type="text" id="filterEndDate" placeholder="结束日期" />
          </div>
        </div>
      </div>
      <div class="fe-field">
        <div class="fe-field-label"><i></i>关键词</div>
        <input class="fe-input-full" type="text" id="filterKeyword" placeholder="输入关键词" />
      </div>
      <button class="fe-btn-query" type="button" onclick="runQuery()">查询</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const listFields = [
      { label: '关键词', key: 'keyword' },
      { label: '预估曝光量', key: 'est_exposure' },
      { label: '预估转化量', key: 'est_conversion' },
      { label: '用户信息', key: 'user_id', relKey: 'user_nickname' },
    ];
    const statFields = [
      { label: '预估曝光合计', key: 'sum_est_exposure', value: '1,280,500' },
      { label: '预估转化合计', key: 'sum_est_conversion', value: '32,680' },
      { label: '关键词数', key: 'keyword_count', value: '156' },
      { label: '数据条数', key: 'row_count', value: '3' },
    ];
    const ALL_ROWS = [
      { id: 'd1', keyword: 'Summer推广词', est_exposure: '520,000', est_conversion: '12,800', user_id: 'U-10086', user_nickname: '张三', lastOrderDate: '2026.08.23' },
      { id: 'd2', keyword: '秋季新品词', est_exposure: '380,500', est_conversion: '9,200', user_id: 'U-10201', user_nickname: '李四', lastOrderDate: '2026.08.22' },
      { id: 'd3', keyword: '达人种草词', est_exposure: '280,000', est_conversion: '6,680', user_id: 'U-10388', user_nickname: '王五', lastOrderDate: '2026.08.21' },
    ];
    const MOCK_PROJECTS = [
      '番茄小说', '知乎故事', '番茄畅听', '红果短剧APP-短剧', '红果漫剧APP', '迅雷网盘',
      '书旗短篇', '最右', 'UC故事会', '起点', 'QQ阅读', '飞卢小说', '七猫小说',
      '掌阅长篇', '书旗长篇', '盐言星图', '盐言聚星', '悟空网文',
    ];

    let detailRows = ALL_ROWS.slice();
    let selectedProject = MOCK_PROJECTS[0];
    let filterOpen = false;

    function projectIconAbbr(name) {
      return String(name).slice(0, 2);
    }

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    }

    function renderProjectPickerList() {
      const list = document.getElementById('projectPickerList');
      if (!list) return;
      list.innerHTML = MOCK_PROJECTS.map(name => `
        <button type="button" class="fe-project-picker-item${name === selectedProject ? ' active' : ''}" onclick="selectProject('${name.replace(/'/g, "\\'")}')">
          <span class="icon">${esc(projectIconAbbr(name))}</span>
          <span class="label">${esc(name)}</span>
          ${name === selectedProject ? '<span class="check">✓</span>' : ''}
        </button>
      `).join('');
    }

    function openProjectPicker() {
      renderProjectPickerList();
      document.getElementById('projectPickerOverlay')?.classList.add('open');
    }

    function closeProjectPicker() {
      document.getElementById('projectPickerOverlay')?.classList.remove('open');
    }

    function selectProject(name) {
      if (!MOCK_PROJECTS.includes(name)) return;
      selectedProject = name;
      closeProjectPicker();
      renderAllScreens();
      showToast('已切换项目：' + name);
    }

    function openFilterSheet() {
      filterOpen = true;
      document.getElementById('filterOverlay')?.classList.add('open');
      syncFilterOverlayState();
    }

    function closeFilterSheet() {
      filterOpen = false;
      document.getElementById('filterOverlay')?.classList.remove('open');
      syncFilterOverlayState();
    }

    function syncFilterOverlayState() {
      document.querySelectorAll('.fe-filter-btn').forEach(btn => {
        btn.classList.toggle('open', filterOpen);
      });
    }

    function onTimeRangeChange() {
      const val = document.getElementById('filterTimeRange')?.value;
      document.getElementById('customRange')?.classList.toggle('show', val === 'custom');
    }

    function getRowFieldValue(row, field) {
      if (field.relKey) {
        const main = row[field.key] ?? '—';
        const sub = row[field.relKey] ?? '';
        return { main: String(main), sub: sub ? String(sub) : '' };
      }
      const val = row[field.key];
      return { main: val != null && val !== '' ? String(val) : '—', sub: '' };
    }

    function renderProjectRow(interactive) {
      const click = interactive ? ' onclick="openProjectPicker()"' : '';
      return `
        <button type="button" class="fe-project-row"${click}>
          <div class="fe-project-icon">${esc(projectIconAbbr(selectedProject))}</div>
          <div class="fe-project-meta">
            <div class="sub">当前项目</div>
            <div class="name">${esc(selectedProject)}<span class="chev">⌄</span></div>
          </div>
        </button>`;
    }

    function renderHeader(interactive) {
      const filterClick = interactive ? ' onclick="openFilterSheet()"' : '';
      const filterClass = filterOpen ? 'fe-filter-btn open' : 'fe-filter-btn';
      return `
        <div class="fe-header">
          <button type="button" class="fe-back-btn" aria-label="返回">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div class="fe-header-main">
            ${renderProjectRow(interactive)}
            <button type="button" class="${filterClass}"${filterClick}>筛选 <span class="chev">⌄</span></button>
          </div>
        </div>`;
    }

    function renderStatsSection() {
      const hero = statFields[0];
      const grid = statFields.slice(1);
      return `
        <div class="fe-stat-hero">
          <div class="label">当前筛选下的总数据 · ${esc(hero.label)}</div>
          <div class="val">${esc(hero.value)}</div>
          <div class="hint">统计项由后台「数据统计」配置，查询数据仅供参考</div>
        </div>
        <div class="fe-stat-grid">
          ${grid.map(f => `
            <div class="fe-stat-mini">
              <div class="val">${esc(f.value)}</div>
              <div class="name">${esc(f.label)}</div>
            </div>
          `).join('')}
        </div>`;
    }

    function renderDetailCards(rows) {
      const count = rows.length;
      const titleHtml = `<div class="fe-detail-section-title">明细 · ${count} 条</div>`;
      if (!rows.length) {
        return titleHtml + '<div class="fe-detail-empty">暂无数据，请调整查询条件</div>';
      }
      const titleField = listFields[0];
      const bodyFields = listFields.slice(1);
      const cards = rows.map(row => {
        const titleVal = getRowFieldValue(row, titleField);
        return `
          <div class="fe-detail-card">
            <div class="fe-detail-title">${esc(titleVal.main)}</div>
            <div class="fe-detail-data">
              ${bodyFields.map(f => {
                const { main, sub } = getRowFieldValue(row, f);
                return `<div>
                  <div class="cell-value">${esc(main)}</div>
                  ${sub ? `<div class="cell-sub">${esc(sub)}</div>` : ''}
                  <div class="cell-label">${esc(f.label)}</div>
                </div>`;
              }).join('')}
            </div>
            <div class="fe-detail-foot">最近出单：${esc(row.lastOrderDate || '—')}</div>
          </div>`;
      }).join('');
      return titleHtml + cards;
    }

    function renderPage(containerId, opts = {}) {
      const rows = opts.rows !== undefined ? opts.rows : detailRows;
      const interactive = opts.interactive !== false;
      const el = document.getElementById(containerId);
      if (!el) return;

      el.innerHTML = `
        ${renderHeader(interactive)}
        ${renderStatsSection()}
        ${renderDetailCards(rows)}
      `;
    }

    function renderAllScreens() {
      renderPage('screen-data-query', { interactive: true, rows: detailRows });
      renderPage('screen-filter-open', { interactive: false, rows: ALL_ROWS });
      renderPage('screen-empty-result', { interactive: false, rows: [] });
      syncFilterOverlayState();
    }

    function runQuery() {
      const kw = (document.getElementById('filterKeyword')?.value || '').trim().toLowerCase();
      detailRows = kw
        ? ALL_ROWS.filter(r => r.keyword.toLowerCase().includes(kw))
        : ALL_ROWS.slice();
      closeFilterSheet();
      renderAllScreens();
      const active = document.querySelector('.screen.active')?.id || 'screen-data-query';
      goToScreen(active === 'screen-empty-result' ? 'screen-data-query' : active);
      showToast('Demo：已查询「' + selectedProject + '」（Mock），已刷新统计与明细');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    const screens = ['screen-data-query', 'screen-filter-open', 'screen-empty-result'];

    function goToScreen(id) {
      screens.forEach(s => {
        document.getElementById(s).classList.toggle('active', s === id);
      });
      document.querySelectorAll('.demo-nav button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.screen === id);
      });
      if (id === 'screen-filter-open') {
        filterOpen = true;
        document.getElementById('filterOverlay')?.classList.add('open');
      } else {
        filterOpen = false;
        document.getElementById('filterOverlay')?.classList.remove('open');
      }
      syncFilterOverlayState();
    }

    document.querySelectorAll('.demo-nav button').forEach(btn => {
      btn.addEventListener('click', () => goToScreen(btn.dataset.screen));
    });

    window.addEventListener('message', e => {
      if (e.data?.type === 'goToScreen' && screens.includes(e.data.screen)) {
        goToScreen(e.data.screen);
      }
    });

    if (new URLSearchParams(location.search).get('embed') === '1') {
      document.body.classList.add('embed-mode');
    }

    const screenParam = new URLSearchParams(location.search).get('screen');
    renderAllScreens();
    renderProjectPickerList();
    onTimeRangeChange();

    if (screenParam && screens.includes(screenParam)) goToScreen(screenParam);
  </script>
</body>
</html>
