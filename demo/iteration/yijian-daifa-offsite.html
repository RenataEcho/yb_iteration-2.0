<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>站外稿件下载</title>
  <style>
    :root {
      --orange: #ff6b1a;
      --orange-light: #fff3eb;
      --bg: #f5f6f8;
      --text: #1a2332;
      --muted: #8a93a0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #e8eaed; color: var(--text); }
    .demo-nav { display: none; }
    body:not(.embed-mode) .demo-nav {
      display: flex; gap: 8px; max-width: 390px; margin: 16px auto 0; flex-wrap: wrap;
    }
    body:not(.embed-mode) .demo-nav button {
      padding: 6px 10px; border-radius: 999px; border: 1px solid #ddd; background: #fff; font-size: 12px; cursor: pointer;
    }
    body:not(.embed-mode) .demo-nav button.on { background: var(--orange-light); color: var(--orange); border-color: #ffd4b8; font-weight: 700; }
    .phone {
      width: 390px; height: 844px; margin: 12px auto 32px; background: #111; border-radius: 36px;
      overflow: hidden; position: relative; box-shadow: 0 18px 48px rgba(0,0,0,.18);
    }
    body.embed-mode { background: #e8eaed; }
    body.embed-mode .phone { margin: 0 auto; }
    .screen { height: 100%; background: var(--bg); display: flex; flex-direction: column; }
    .status-bar { height: 44px; padding: 12px 20px 0; display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; }
    .hero { width: 100%; aspect-ratio: 1; background: #1a1a1a; overflow: hidden; position: relative; }
    .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .badge {
      position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,.55); color: #fff;
      font-size: 11px; padding: 4px 8px; border-radius: 999px;
    }
    .body { flex: 1; overflow: auto; padding: 16px 16px 8px; }
    .title { font-size: 20px; font-weight: 800; line-height: 1.35; }
    .kv { margin-top: 16px; display: grid; grid-template-columns: 76px 1fr; gap: 10px 8px; font-size: 13px; }
    .kv dt { color: var(--muted); }
    .note {
      margin-top: 16px; padding: 12px; border-radius: 12px; background: #fff; font-size: 12px;
      color: #64748b; line-height: 1.6;
    }
    .foot { padding: 12px 16px 22px; background: #fff; border-top: 1px solid #f3f3f3; }
    .btn {
      width: 100%; height: 48px; border: none; border-radius: 12px; background: var(--orange);
      color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .empty { padding: 80px 24px; text-align: center; color: var(--muted); line-height: 1.7; }
    .empty b { display: block; color: var(--text); font-size: 18px; margin-bottom: 8px; }
    .toast {
      position: absolute; left: 50%; bottom: 88px; transform: translateX(-50%);
      background: #1a2332; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 13px;
      opacity: 0; pointer-events: none; z-index: 8; white-space: nowrap;
    }
    .toast.show { opacity: 1; }
    .load {
      position: absolute; inset: 0; background: rgba(0,0,0,.45); display: none; place-items: center; z-index: 6;
    }
    .load.show { display: grid; }
    .load b { background: #fff; padding: 16px 22px; border-radius: 12px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="demo-nav" id="sceneNav"></div>
  <div class="phone">
    <section class="screen">
      <div class="status-bar"><span>9:41</span><span>5G</span></div>
      <div id="page"></div>
    </section>
    <div class="load" id="load"><b id="loadText">正在下载</b></div>
    <div class="toast" id="toast"></div>
  </div>
  <script src="yijian-daifa-store.js"></script>
  <script>
    var embedMode = /(?:^|[?&])embed=1(?:&|$)/.test(location.search);
    var STORE = YJD.open({ reset: !embedMode });
    var params = new URLSearchParams(location.search);
    var workId = params.get('id') || 'X-01';

    function toast(msg) {
      var el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(function () { el.classList.remove('show'); }, 1800);
    }
    function persist() { YJD.save(STORE); }
    function current() { return YJD.workById(STORE, workId); }

    function render() {
      var w = current();
      var box = document.getElementById('page');
      if (!w || !YJD.isOffsite(w)) {
        box.innerHTML = '<div class="empty" id="offEmpty"><b>链接已失效</b>链接已失效或稿件不存在。<br />请向剪辑手重新获取分享链接或二维码。</div>';
        return;
      }
      if (YJD.offsiteExhausted(w)) {
        box.innerHTML = '<div class="empty" id="offEmpty"><b>素材已领完</b>这份稿件的素材已被全部下载。<br />请向剪辑手重新获取其他分享链接或二维码。</div>';
        return;
      }
      var n = YJD.offsiteAssetCount(w);
      var left = YJD.offsiteRemaining(w);
      box.innerHTML =
        '<div class="hero">' +
          '<img src="' + (w.cover || 'assets/fr014/cover-m01.jpg') + '" alt="" />' +
          '<div class="badge">剩余 ' + left + ' / ' + n + ' 个</div>' +
        '</div>' +
        '<div class="body">' +
          '<div class="title">' + esc(w.title) + '</div>' +
          '<dl class="kv">' +
            '<dt>项目</dt><dd>' + esc(w.project) + '</dd>' +
            '<dt>书籍</dt><dd>' + esc(w.book) + '</dd>' +
            '<dt>书籍 ID</dt><dd>' + esc(w.bookId || '—') + '</dd>' +
            '<dt>类型</dt><dd>' + esc(w.kind) + '</dd>' +
          '</dl>' +
          '<div class="note">无需登录。点下载立即扣除 1 个素材余量，剩余 ' + left + ' 个。</div>' +
        '</div>' +
        '<div class="foot"><button class="btn" type="button" id="dlBtn">下载稿件</button></div>';
      document.getElementById('dlBtn').onclick = downloadWork;
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
      });
    }
    function downloadWork() {
      var w = current();
      if (!w || !YJD.isOffsite(w)) { toast('稿件已不存在'); return; }
      if (YJD.offsiteExhausted(w) || !YJD.claimOffsiteAsset(STORE, w)) {
        persist();
        render();
        toast('素材已领完');
        return;
      }
      persist();
      var load = document.getElementById('load');
      var text = document.getElementById('loadText');
      load.classList.add('show');
      text.textContent = '正在下载';
      setTimeout(function () {
        text.textContent = '已保存到相册';
        setTimeout(function () {
          load.classList.remove('show');
          render();
          toast('已下载，该素材云端副本已删除');
        }, 500);
      }, 700);
    }

    var samples = YJD.worksByChannel(STORE, '站外');
    document.getElementById('sceneNav').innerHTML = samples.map(function (w) {
      return '<button type="button" data-id="' + w.id + '"' + (w.id === workId ? ' class="on"' : '') + '>' + w.title + '</button>';
    }).join('');
    document.querySelectorAll('#sceneNav button').forEach(function (btn) {
      btn.onclick = function () {
        workId = btn.dataset.id;
        history.replaceState(null, '', '?id=' + encodeURIComponent(workId) + (embedMode ? '&embed=1' : ''));
        render();
        document.querySelectorAll('#sceneNav button').forEach(function (b) { b.classList.toggle('on', b === btn); });
      };
    });
    if (embedMode) document.body.classList.add('embed-mode');
    render();
    if (window.YJD && YJD.onChange) {
      YJD.onChange(function () {
        STORE = YJD.open();
        render();
      });
    }
    if (window.parent !== window) window.parent.postMessage({ type: 'yijianDaifaOffsite', id: workId }, '*');
  </script>
</body>
</html>
